version: '3.8'

services:
  diffbot-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diffbot-mcp-server
    restart: always
    ports:
      - "8154:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_TRANSPORT=http
      - MCP_BASE_URL=https://mcp.diffbot.com
      - DIFFBOT_OAUTH_CLIENT_ID=diffbot-mcp-server
    # DIFFBOT_OAUTH_ISSUER and DIFFBOT_OAUTH_CLIENT_SECRET come from a hand-made .env on the
    # host, which the deploy rsync skips. Without it, OAuth stays off.
    env_file:
      - path: .env
        required: false
