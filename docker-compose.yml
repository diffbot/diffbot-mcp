version: '3.8'

services:
  diffbot-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diffbot-mcp-server
    restart: always
    ports:
      - "8154:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_TRANSPORT=http
      - DIFFBOT_OAUTH_ISSUER
      - MCP_BASE_URL
      - DIFFBOT_OAUTH_CLIENT_ID
      - DIFFBOT_OAUTH_CLIENT_SECRET
