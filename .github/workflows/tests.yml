name: Tests

# Unit tests only (tests/test_*.py): no network, no Diffbot token. The live smoke test
# (tests/smoke.py) and the routing eval stay manual.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[dev]"
      - name: Run unit tests
        run: pytest tests/test_auth.py tests/test_builder.py -q
