# Dependabot: Diffbot-owned packages and GitHub Actions only, kept low-noise.
# Floor rule: change a range only when it would not pick up the new release on a
# fresh install. Keep this file in the same shape as the other Diffbot repos.
version: 2
updates:
  # Diffbot-owned PyPI package only (the `diffbot` SDK). increase-if-necessary
  # keeps the specifier unless it would not pick up the new release (floor rule).
  # pyproject.toml only; there is no lockfile on purpose. Merging to main deploys
  # mcp.diffbot.com, so treat a merged bump as a deploy.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-name: diffbot
    groups:
      diffbot:
        patterns:
          - diffbot

  # GitHub Actions used by .github/workflows. One grouped PR a month at most.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
