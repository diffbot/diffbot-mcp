[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffbot-mcp"
version = "0.2.0"
description = "A Diffbot MCP server with a variety of helpful web knowledge fetching tools for your agent or LLM pipeline."
readme = "README.md"
requires-python = ">=3.10"
# Pinned to the patch level: every push to main rebuilds the image and redeploys,
# so an unpinned minor lets an untested dependency release reach production on a
# commit that never touched it.
dependencies = [
    "fastmcp~=4.1.0",
    "aiohttp~=3.14.5"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["diffbot_mcp", "diffbot_mcp.tools"]
py-modules = ["diffbot_mcp_server"]

