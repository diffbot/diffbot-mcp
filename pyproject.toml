[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffbot-mcp"
version = "0.3.0"
description = "Web knowledge fetching tools for your agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Every push to main rebuilds the image and redeploys with a fresh install (there
# is no lockfile), so an open-ended range lets an untested dependency release reach
# production on a commit that never touched it. fastmcp is pinned to the patch
# level. diffbot is our own SDK and follows semver, so it is capped below the next
# major (4.0 may break the client API this server calls); raise the cap deliberately
# after testing against a new major.
dependencies = [
    "fastmcp~=4.1.0",
    "diffbot>=3.4.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/diffbot/diffbot-mcp"
Repository = "https://github.com/diffbot/diffbot-mcp"
Issues = "https://github.com/diffbot/diffbot-mcp/issues"
Documentation = "https://www.diffbot.com/docs/"

[project.scripts]
diffbot-mcp = "diffbot_mcp_server:main"

[tool.setuptools]
packages = ["diffbot_mcp", "diffbot_mcp.tools"]
py-modules = ["diffbot_mcp_server"]

