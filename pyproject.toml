[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffbot-mcp"
version = "0.2.2"
description = "Web knowledge fetching tools for your agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Pinned to the patch level: every push to main rebuilds the image and redeploys,
# so an unpinned minor lets an untested dependency release reach production on a
# commit that never touched it.
dependencies = [
    "fastmcp~=4.1.0",
    "aiohttp~=3.14.5"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/diffbot/diffbot-mcp"
Repository = "https://github.com/diffbot/diffbot-mcp"
Issues = "https://github.com/diffbot/diffbot-mcp/issues"
Documentation = "https://www.diffbot.com/docs/"

[project.scripts]
diffbot-mcp = "diffbot_mcp_server:main"

[tool.setuptools]
packages = ["diffbot_mcp", "diffbot_mcp.tools"]
py-modules = ["diffbot_mcp_server"]

